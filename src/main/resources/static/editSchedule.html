<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여행 일정 수정</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>
</head>
<body class="bg-gray-100">
<div class="container mx-auto px-4 py-8 max-w-2xl">
  <div class="bg-white rounded-lg shadow-md p-6">
    <h1 class="text-2xl font-bold mb-8 text-center">여행 일정 수정</h1>

    <form id="schedule-form" class="space-y-6">
      <!-- 인원 수 입력 -->
      <div>
        <label for="numberOfPeople" class="block text-sm font-medium text-gray-700 mb-2">
          인원 수
        </label>
        <input type="number"
               id="numberOfPeople"
               name="numberOfPeople"
               min="1"
               required
               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
      </div>

      <!-- 지역 선택 -->
      <div>
        <label for="region" class="block text-sm font-medium text-gray-700 mb-2">
          여행 지역
        </label>
        <select id="region"
                name="region"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
          <option value="">지역을 선택하세요</option>
          <option value="seoul">서울</option>
          <option value="busan">부산</option>
          <option value="jeju">제주</option>
          <option value="gangneung">강릉</option>
          <option value="gyeongju">경주</option>
          <option value="jeonju">전주</option>
          <option value="sokcho">속초</option>
          <option value="yeosu">여수</option>
          <option value="andong">안동</option>
          <option value="daegu">대구</option>
        </select>
      </div>

      <!-- 여행 목적 -->
      <div>
        <label for="purpose" class="block text-sm font-medium text-gray-700 mb-2">
          여행 목적
        </label>
        <select id="purpose"
                name="purpose"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
          <option value="">여행 목적을 선택하세요</option>
          <option value="healing">힐링</option>
          <option value="food">식도락</option>
          <option value="sightseeing">관광</option>
        </select>
      </div>

      <!-- 여행 기간 -->
      <div>
        <label for="dateRange" class="block text-sm font-medium text-gray-700 mb-2">
          여행 기간
        </label>
        <input type="text"
               id="dateRange"
               name="dateRange"
               placeholder="여행 기간을 선택하세요"
               required
               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
      </div>

      <!-- 버튼 영역 -->
      <div class="flex justify-end space-x-4 pt-4">
        <button type="button"
                onclick="cancelEdit()"
                class="px-4 py-2 bg-gray-500 text-white rounded-md hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2">
          취소
        </button>
        <button type="submit"
                class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
          수정
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  let scheduleId;

  // 페이지 로드 시 초기화
  document.addEventListener('DOMContentLoaded', async function() {
    if (!localStorage.getItem('token')) {
      alert('로그인이 필요한 서비스입니다.');
      window.location.href = '/login.html';
      return;
    }

    // URL에서 일정 ID 가져오기
    const urlParams = new URLSearchParams(window.location.search);
    scheduleId = urlParams.get('id');

    if (!scheduleId) {
      alert('잘못된 접근입니다.');
      window.location.href = '/mypage.html';
      return;
    }

    // flatpickr 캘린더 초기화
    flatpickr("#dateRange", {
      mode: "range",
      dateFormat: "Y-m-d",
      minDate: "today",
      locale: "ko",
      disableMobile: true
    });

    // 기존 일정 정보 불러오기
    await loadSchedule(scheduleId);
  });

  // 인원 수 입력 제한
  document.getElementById('numberOfPeople').addEventListener('input', function(e) {
    if (this.value < 0) this.value = 0;
    this.value = this.value.replace(/[^0-9]/g, '');
  });

  // 기존 일정 정보 불러오기
  async function loadSchedule(id) {
    try {
      const response = await fetch(`/api/schedules/${id}`, {
        headers: {
          'Authorization': `Bearer ${localStorage.getItem('token')}`
        }
      });

      if (response.ok) {
        const schedule = await response.json();

        document.getElementById('numberOfPeople').value = schedule.numberOfPeople;
        document.getElementById('region').value = schedule.region;
        document.getElementById('purpose').value = schedule.purpose;
        document.getElementById('dateRange').value = `${schedule.startDate} ~ ${schedule.endDate}`;

        // flatpickr 인스턴스의 날짜도 업데이트
        const fp = document.querySelector("#dateRange")._flatpickr;
        fp.setDate([schedule.startDate, schedule.endDate]);
      } else {
        alert('일정을 불러올 수 없습니다.');
        window.location.href = '/mypage.html';
      }
    } catch (error) {
      console.error('Error:', error);
      alert('일정을 불러오는 중 오류가 발생했습니다.');
    }
  }

  // 일정 수정 취소
  function cancelEdit() {
    if (confirm('수정을 취소하시겠습니까?')) {
      window.location.href = '/mypage.html';
    }
  }

  // 일정 수정 제출
  document.getElementById('schedule-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    const dateRangeInput = document.getElementById('dateRange');
    const dates = dateRangeInput.value.split(' ~ ');

    if (dates.length < 1) {
      alert('여행 기간을 선택해주세요.');
      return;
    }

    const startDate = dates[0].trim();
    const endDate = dates.length > 1 ? dates[1].trim() : startDate;

    const scheduleData = {
      title: "여행 일정",
      numberOfPeople: parseInt(document.getElementById('numberOfPeople').value),
      region: document.getElementById('region').value,
      purpose: document.getElementById('purpose').value,
      startDate: startDate,
      endDate: endDate
    };

    try {
      const response = await fetch(`/api/schedules/${scheduleId}`, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${localStorage.getItem('token')}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(scheduleData)
      });

      if (response.ok) {
        alert('일정이 성공적으로 수정되었습니다.');
        window.location.href = '/mypage.html';
      } else {
        const errorData = await response.json();
        alert('일정 수정에 실패했습니다: ' + (errorData.message || '알 수 없는 오류가 발생했습니다.'));
      }
    } catch (error) {
      console.error('Error:', error);
      alert('일정 수정 중 오류가 발생했습니다.');
    }
  });
</script>
</body>
</html>
