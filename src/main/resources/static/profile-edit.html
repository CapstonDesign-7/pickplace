<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
    <script src="/js/auth.js"></script>
</head>
<body class="bg-gray-100">
<div class="container mx-auto px-4 py-8 max-w-4xl">
    <!-- 상단 네비게이션 -->
    <div class="flex justify-between items-center mb-6">
        <button onclick="location.href='/mypage.html'"
                class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
            마이페이지
        </button>
        <div class="flex space-x-4">
            <button id="logout-btn"
                    class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">
                로그아웃
            </button>
            <button onclick="location.href='/index.html'"
                    class="bg-gray-500 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded">
                홈으로 가기
            </button>
        </div>
    </div>

    <!-- 프로필 수정 섹션 -->
    <div class="bg-white rounded-lg shadow-md p-6 mb-8">
        <h2 class="text-2xl font-bold mb-6">프로필 수정</h2>
        <div class="space-y-6">
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                    이름
                </label>
                <input type="text" id="name" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">
                    전화번호
                </label>
                <input type="text" id="phone" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                    이메일
                </label>
                <input type="email" id="email" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>
            <button onclick="updateProfile()"
                    class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                프로필 수정
            </button>
        </div>
    </div>

    <!-- 비밀번호 변경 섹션 -->
    <div class="bg-white rounded-lg shadow-md p-6">
        <h2 class="text-2xl font-bold mb-6">비밀번호 변경</h2>
        <div class="space-y-6">
            <div>
                <label for="current-password" class="block text-sm font-medium text-gray-700 mb-2">
                    현재 비밀번호
                </label>
                <input type="password" id="current-password" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label for="new-password" class="block text-sm font-medium text-gray-700 mb-2">
                    새 비밀번호
                </label>
                <input type="password" id="new-password" required
                       class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
            </div>
            <button onclick="updatePassword()"
                    class="w-full bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">
                비밀번호 변경
            </button>
        </div>
    </div>
</div>

<script>
    async function fetchWithAuth(url, options = {}) {
        const token = localStorage.getItem('token');
        if (!token) {
            alert('로그인이 필요합니다.');
            window.location.href = '/login.html';
            return;
        }
        const headers = {
            ...options.headers,
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
        };
        return await fetch(url, { ...options, headers });
    }

    async function loadProfile() {
        try {
            const response = await fetchWithAuth('/api/members/me');
            if (response.ok) {
                const data = await response.json();
                document.getElementById('name').value = data.name;
                document.getElementById('phone').value = data.phoneNumber;
                document.getElementById('email').value = data.email;
            }
        } catch (error) {
            console.error('Failed to load profile:', error);
        }
    }

    async function updateProfile() {
        const profileData = {
            name: document.getElementById('name').value,
            phoneNumber: document.getElementById('phone').value,
            email: document.getElementById('email').value
        };
        try {
            const response = await fetchWithAuth('/api/members/update-profile', {
                method: 'POST',
                body: JSON.stringify(profileData)
            });
            if (response.ok) {
                alert('프로필이 성공적으로 업데이트되었습니다.');
            } else {
                alert('프로필 업데이트 실패');
            }
        } catch (error) {
            console.error('Failed to update profile:', error);
        }
    }

    async function updatePassword() {
        const passwordData = {
            currentPassword: document.getElementById('current-password').value,
            newPassword: document.getElementById('new-password').value
        };
        try {
            const response = await fetchWithAuth('/api/members/update-password', {
                method: 'POST',
                body: JSON.stringify(passwordData)
            });
            if (response.ok) {
                alert('비밀번호가 성공적으로 변경되었습니다.');
                document.getElementById('current-password').value = '';
                document.getElementById('new-password').value = '';
            } else {
                alert('비밀번호 변경 실패');
            }
        } catch (error) {
            console.error('Failed to update password:', error);
        }
    }

    document.addEventListener('DOMContentLoaded', loadProfile);

    // 로그아웃
    document.getElementById('logout-btn').addEventListener('click', () => {
        localStorage.removeItem('token');
        window.location.href = '/login.html';
    });

    // 홈 버튼 클릭 시 index.html로 이동
    function goHome() {
        window.location.href = '/index.html';  // 홈 페이지로 리디렉션
    }
</script>
</body>
</html>
