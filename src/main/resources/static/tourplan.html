<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Plan</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
<div class="container mx-auto p-8">
  <h2 class="text-2xl font-bold text-center mb-8">여행 계획 입력</h2>
  <form id="travel-plan-form" class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4">
    <div class="mb-4">
      <label class="block text-gray-700 font-bold mb-2" for="groupSize">인원수</label>
      <input type="number" id="groupSize" min="1" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none" placeholder="예: 2" required>
    </div>

    <div class="mb-4">
      <label class="block text-gray-700 font-bold mb-2" for="region">선호하는 지역</label>
      <select id="region" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none" required>
        <option value="" disabled selected>지역을 선택하세요</option>
        <option value="서울">서울</option>
        <option value="부산">부산</option>
        <option value="대구">대구</option>
        <option value="인천">인천</option>
        <option value="광주">광주</option>
        <option value="대전">대전</option>
        <option value="울산">울산</option>
        <option value="경기도">경기도</option>
        <option value="강원도">강원도</option>
        <option value="충청도">충청도</option>
        <option value="전라도">전라남도</option>
        <option value="경상도">경상남도</option>
      </select>
    </div>

    <div class="mb-4">
      <label class="block text-gray-700 font-bold mb-2" for="purpose">여행 목적</label>
      <select id="purpose" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none" required>
        <option value="" disabled selected>여행 목적을 선택하세요</option>
        <option value="관광">관광</option>
        <option value="휴식">휴식</option>
        <option value="식도락">식도락</option>
        <option value="1인 여행">1인 여행</option>
      </select>
    </div>

    <div class="mb-4">
      <label class="block text-gray-700 font-bold mb-2" for="duration">여행 기간 (일수)</label>
      <input type="number" id="duration" min="1" class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none" placeholder="예: 3" required>
    </div>

    <div class="flex items-center justify-between">
      <button type="button" id="confirm-btn" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">확인</button>
      <button type="button" id="cancel-btn" class="bg-red-500 hover:bg-red-700 text-white font-bold py-2 px-4 rounded">취소</button>
    </div>
  </form>
</div>

<script>
  // 확인 버튼 클릭 시 처리
  document.getElementById('confirm-btn').addEventListener('click', async () => {
    const groupSize = document.getElementById('groupSize').value;
    const region = document.getElementById('region').value;
    const purpose = document.getElementById('purpose').value;
    const duration = document.getElementById('duration').value;

    // 입력 값 검증
    if (!groupSize || !region || !purpose || !duration) {
      alert('모든 필드를 채워주세요!');
      return;
    }

    // 로그인 상태 체크
    const token = localStorage.getItem('token');
    if (!token) {
      alert('로그인이 되어 있지 않습니다. 로그인 후 다시 시도해주세요.');
      window.location.href = '/login.html';  // 로그인 페이지로 리다이렉트
      return;
    }

    const travelPlan = { groupSize, region, purpose, duration };

    try {
      const response = await fetchWithAuth('/api/travel-plan/recommend', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify(travelPlan)
      });

      if (response.ok) {
        window.location.href = '/recommend-details.html';
      } else {
        alert('여행 계획을 저장하는 데 실패했습니다.');
      }
    } catch (error) {
      console.error('API request failed:', error);
      alert('서버와 통신 중 오류가 발생했습니다.');
    }
  });

  // 취소 버튼 클릭 시 index.html로 이동
  document.getElementById('cancel-btn').addEventListener('click', () => {
    window.location.href = '/index.html';
  });

  // 로그인 인증을 체크하는 fetchWithAuth 함수
  async function fetchWithAuth(url, options = {}) {
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = '/login.html';
      throw new Error('No token found');
    }
    const headers = {
      ...options.headers,
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json'
    };
    try {
      const response = await fetch(url, { ...options, headers });
      if (response.status === 401) {
        localStorage.removeItem('token');
        window.location.href = '/login.html';
        return;
      }
      return response;
    } catch (error) {
      console.error('API request failed:', error);
      throw error;
    }
  }
</script>
</body>
</html>
