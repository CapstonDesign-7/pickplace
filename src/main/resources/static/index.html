<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
<div class="flex flex-col h-screen">
  <header class="p-4 flex justify-between items-center bg-gray-100">
    <div>
      <a href="#" class="text-blue-500 font-semibold" onclick="scrollToPhotoReview()">포토리뷰</a>
    </div>
    <div id="auth-buttons" class="flex space-x-4">
      <!-- 로그인 및 회원가입 버튼 -->
      <button id="login-btn" class="text-blue-500 mr-4">로그인</button>
      <button id="signup-btn" class="text-blue-500">회원가입</button>

      <!-- 프로필 아이콘 (로그인된 상태에서만 보임) -->
      <div id="profile-icon" class="hidden relative">
        <button class="w-10 h-10 rounded-full bg-gray-300 flex items-center justify-center text-white" id="profile-btn">
          <span class="text-lg">👤</span>
        </button>
        <div id="profile-menu" class="hidden absolute right-0 mt-2 w-40 bg-white shadow-md rounded-lg">
          <ul>
            <li>
              <a href="/mypage.html" class="block px-4 py-2 text-gray-800">마이페이지</a>
            </li>
            <li>
              <a href="/user.html" class="block px-4 py-2 text-gray-800">사용자 관리</a>
            </li>
            <li>
              <button id="logout-btn" class="block px-4 py-2 text-gray-800 w-full text-left">로그아웃</button>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </header>

  <main class="flex-grow flex flex-col justify-center items-center">
    <button
            class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none"
            onclick="startTour()">
      시작하기
    </button>
  </main>

  <section id="photo-review" class="hidden p-8">
    <div class="flex justify-center items-center">
      <input type="text" placeholder="검색어를 입력하세요..."
             class="shadow appearance-none border rounded w-2/3 py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
      <button class="ml-4 bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">리뷰 쓰기</button>
    </div>
  </section>
</div>

<script>
  // 로그인 상태 체크
  function checkLoginStatus() {
    const token = localStorage.getItem('token');
    const loginBtn = document.getElementById('login-btn');
    const signupBtn = document.getElementById('signup-btn');
    const profileIcon = document.getElementById('profile-icon');

    if (token) {
      // 로그인 상태: 프로필 아이콘 보이기, 로그인/회원가입 버튼 숨기기
      loginBtn.style.display = 'none';
      signupBtn.style.display = 'none';
      profileIcon.classList.remove('hidden');
    } else {
      // 비로그인 상태: 로그인/회원가입 버튼 보이기, 프로필 아이콘 숨기기
      loginBtn.style.display = 'inline-block';
      signupBtn.style.display = 'inline-block';
      profileIcon.classList.add('hidden');
    }
  }

  // 프로필 버튼 클릭 시 드롭다운 토글
  document.getElementById('profile-btn').addEventListener('click', () => {
    const menu = document.getElementById('profile-menu');
    menu.classList.toggle('hidden');
  });

  // 로그인 버튼 클릭 시 처리
  document.getElementById('login-btn').addEventListener('click', () => {
    window.location.href = '/login.html';
  });

  // 회원가입 버튼 클릭 시 처리
  document.getElementById('signup-btn').addEventListener('click', () => {
    window.location.href = '/register.html';
  });

  // 시작하기 버튼 클릭 시 처리
  async function startTour() {
    try {
      // 로그인 상태 확인을 위해 인증된 API 호출
      const response = await fetchWithAuth('/api/members/me');
      if (response && response.ok) {
        window.location.href = '/tourplan.html'; // 인증 성공 시 이동
      }
    } catch (error) {
      window.location.href = '/login.html'; // 인증 실패 시 로그인 페이지로 이동
    }
  }

  // 로그인 인증을 체크하는 fetchWithAuth 함수
  async function fetchWithAuth(url, options = {}) {
    const token = localStorage.getItem('token');
    if (!token) {
      throw new Error('No token found');
    }
    const headers = {
      ...options.headers,
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json'
    };
    try {
      const response = await fetch(url, { ...options, headers });
      if (response.status === 401) {
        localStorage.removeItem('token');
        window.location.href = '/login.html';
        return;
      }
      return response;
    } catch (error) {
      console.error('API request failed:', error);
      throw error;
    }
  }

  // 로그아웃
  document.getElementById('logout-btn').addEventListener('click', () => {
    localStorage.removeItem('token');
    window.location.href = '/login.html';
  });

  // 페이지가 로드될 때 로그인 상태 확인
  checkLoginStatus();
</script>
</body>
</html>
