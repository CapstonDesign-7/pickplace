<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
<div class="flex justify-center items-center h-screen">
    <div class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4 w-full max-w-md">
        <h2 class="text-2xl font-bold mb-4">Register</h2>
        <form id="register-form">
            <div class="mb-4">
                <label class="block text-gray-700 font-bold mb-2" for="id">
                    ID
                </label>
                <input
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        id="id" type="text" placeholder="ID를 입력하세요..">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-bold mb-2" for="password">
                    Password
                </label>
                <input
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        id="password" type="password" placeholder="비밀번호를 입력하세요..">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-bold mb-2" for="name">
                    이름
                </label>
                <input
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        id="name" type="text" placeholder="이름을 입력하세요..">
            </div>
            <div class="mb-6">
                <label class="block text-gray-700 font-bold mb-2" for="phone-number">
                    전화번호
                </label>
                <input
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        id="phone-number" type="tel" placeholder="전화번호를 입력하세요..">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-bold mb-2" for="email">
                    이메일
                </label>
                <input
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        id="email" type="email" placeholder="이메일을 입력하세요..">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-bold mb-2" for="birthdate">
                    생일
                </label>
                <input
                        class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                        id="birthdate" type="date">
            </div>
            <div class="mb-4">
                <label class="block text-gray-700 font-bold mb-2">
                    성별
                </label>
                <div class="flex items-center">
                    <input type="radio" id="male" name="gender" value="M" class="mr-2">
                    <label for="male" class="text-gray-700">남성</label>

                    <input type="radio" id="female" name="gender" value="F" class="ml-4 mr-2">
                    <label for="female" class="text-gray-700">여성</label>
                </div>
            </div>
            <div class="flex items-center justify-between">
                <button
                        class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline"
                        type="button" id="register-btn">
                    회원가입 하기
                </button>
                <a
                        class="inline-block align-baseline font-bold text-sm text-blue-500 hover:text-blue-800"
                        href="#" id="login-btn">
                    로그인 화면
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    // 회원가입 버튼
    document.getElementById('register-btn').addEventListener('click', () => {
        const id = document.getElementById('id').value;
        const password = document.getElementById('password').value;
        const name = document.getElementById('name').value;
        const phoneNumber = document.getElementById('phone-number').value;
        const email = document.getElementById('email').value;
        const birthdate = document.getElementById('birthdate').value;
        const gender = document.querySelector('input[name="gender"]:checked')?.value;

        // 로그인 API 호출
        fetch('/api/members/join', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ id, password, name, phoneNumber, email, birth: birthdate, gender })
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // 회원가입 성공
                    alert(data.message);
                    // 로그인 페이지로 리다이렉트
                    window.location.href = '/';
                } else {
                    // 회원가입 실패
                    alert(data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('회원가입 중 오류가 발생했습니다.');
            });
    });

    // 로그인 버튼
    document.getElementById('login-btn').addEventListener('click', () => {
        // 리다이렉트 로그인
        window.location.href = '/';
    });
</script>
</body>
</html>
