<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>여행 일정 만들기</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ko.js"></script>
</head>
<body class="bg-gray-100">
<div class="container mx-auto px-4 py-8 max-w-2xl">
  <div class="bg-white rounded-lg shadow-md p-6">
    <h1 class="text-2xl font-bold mb-8 text-center">여행 일정 만들기</h1>

    <form id="schedule-form" class="space-y-6">
      <!-- 인원 수 입력 -->
      <div>
        <label for="numberOfPeople" class="block text-sm font-medium text-gray-700 mb-2">
          인원 수
        </label>
        <input type="number"
               id="numberOfPeople"
               name="numberOfPeople"
               min="1"
               required
               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
      </div>

      <!-- 지역 선택 -->
      <div>
        <label for="region" class="block text-sm font-medium text-gray-700 mb-2">
          여행 지역
        </label>
        <select id="region"
                name="region"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
          <option value="">지역을 선택하세요</option>
          <option value="서울">서울</option>
          <option value="부산">부산</option>
          <option value="제주">제주</option>
          <option value="강릉">강릉</option>
          <option value="경주">경주</option>
          <option value="전주">전주</option>
          <option value="속초">속초</option>
          <option value="여수">여수</option>
          <option value="안동">안동</option>
          <option value="대구">대구</option>
        </select>
      </div>

      <!-- 여행 목적 -->
      <div>
        <label for="purpose" class="block text-sm font-medium text-gray-700 mb-2">
          여행 목적
        </label>
        <select id="purpose"
                name="purpose"
                required
                class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
          <option value="">여행 목적을 선택하세요</option>
          <option value="힐링">힐링</option>
          <option value="식도락">식도락</option>
          <option value="관광">관광</option>
          <option value="액티비티">액티비티</option>
        </select>
      </div>

      <!-- 여행 기간 -->
      <div>
        <label for="dateRange" class="block text-sm font-medium text-gray-700 mb-2">
          여행 기간
        </label>
        <input type="text"
               id="dateRange"
               name="dateRange"
               placeholder="여행 기간을 선택하세요"
               required
               class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
      </div>

      <!-- 버튼 영역 -->
      <div class="flex justify-end space-x-4 pt-4">
        <button type="button"
                onclick="location.href='/index.html'"
                class="px-4 py-2 bg-gray-500 text-white rounded-md hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2">
          취소
        </button>
        <button type="submit"
                class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2">
          확인
        </button>
      </div>
    </form>
  </div>
</div>

<script>
  // 페이지 로드 시 로그인 체크
  document.addEventListener('DOMContentLoaded', function() {
    if (!localStorage.getItem('token')) {
      alert('로그인이 필요한 서비스입니다.');
      window.location.href = '/login.html';
      return;
    }

    // flatpickr 캘린더 초기화
    flatpickr("#dateRange", {
      mode: "range",
      dateFormat: "Y-m-d",
      minDate: "today",
      locale: "ko",
      disableMobile: true,
      onChange: function(selectedDates) {
        if (selectedDates.length === 2) {
          // 시작일과 종료일이 모두 선택된 경우
          const startDate = selectedDates[0];
          const endDate = selectedDates[1];
          console.log('Selected date range:', {startDate, endDate});
        }
      }
    });
  });

  // 인원 수 입력 제한
  document.getElementById('numberOfPeople').addEventListener('input', function(e) {
    // 음수 입력 방지
    if (this.value < 0) {
      this.value = 0;
    }
    // 숫자가 아닌 값 제거
    this.value = this.value.replace(/[^0-9]/g, '');
  });

  // 폼 제출 처리 수정
  // flatpickr 설정과 폼 제출 처리를 수정
  document.getElementById('schedule-form').addEventListener('submit', async function(e) {
    e.preventDefault();

    const dateRangeInput = document.getElementById('dateRange');
    const dates = dateRangeInput.value.split(' ~ '); // 날짜 구분자로 분리

    if (dates.length < 1) {
      alert('여행 기간을 선택해주세요.');
      return;
    }

    // 날짜 문자열 정리 (앞뒤 공백 제거)
    const startDate = dates[0].trim();
    const endDate = dates.length > 1 ? dates[1].trim() : startDate;

    const scheduleData = {
      title: "새로운 여행",
      numberOfPeople: parseInt(document.getElementById('numberOfPeople').value),
      region: document.getElementById('region').value,
      purpose: document.getElementById('purpose').value,
      startDate: startDate,  // YYYY-MM-DD 형식
      endDate: endDate      // YYYY-MM-DD 형식
    };

    console.log('전송할 데이터:', scheduleData); // 디버깅용

    try {
      const response = await fetch('/api/schedules', {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${localStorage.getItem('token')}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(scheduleData)
      });

      if (response.ok) {
        const data = await response.json();
        window.location.href = `/schedule-details.html?id=${data.id}`;
      } else {
        const error = await response.json();
        alert(error.message || '일정 생성에 실패했습니다.');
      }
    } catch (error) {
      console.error('Error:', error);
      alert('일정 생성 중 오류가 발생했습니다.');
    }
  });

  // flatpickr 설정
  flatpickr("#dateRange", {
    mode: "range",
    dateFormat: "Y-m-d", // YYYY-MM-DD 형식
    minDate: "today",
    locale: "ko",
    disableMobile: true
  });
</script>
</body>
</html>
