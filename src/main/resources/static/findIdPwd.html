<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>아이디 및 비밀번호 찾기</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.16/dist/tailwind.min.css" rel="stylesheet">
</head>
<body>
<div class="flex justify-center items-center h-screen">
  <div class="bg-white shadow-md rounded px-8 pt-6 pb-8 mb-4 w-full max-w-md">
    <h2 class="text-2xl font-bold mb-4">아이디 / 비밀번호 찾기</h2>
    <div class="mb-4">
      <button
              class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full"
              id="find-id-btn">
        아이디 찾기
      </button>
    </div>
    <div class="mb-4">
      <button
              class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full"
              id="find-password-btn">
        비밀번호 찾기
      </button>
    </div>

    <!-- 아이디 찾기 폼 -->
    <div id="find-id-form" style="display: none;">
      <div class="mb-4">
        <label class="block text-gray-700 font-bold mb-2" for="name">
          이름
        </label>
        <input
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                id="name" type="text" placeholder="이름">
      </div>
      <div class="mb-4">
        <label class="block text-gray-700 font-bold mb-2" for="email">
          이메일
        </label>
        <input
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                id="email" type="email" placeholder="이메일">
      </div>
      <button
              class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full"
              id="submit-find-id">
        이메일로 받기
      </button>
    </div>

    <!-- 비밀번호 찾기 폼 -->
    <div id="find-password-form" style="display: none;">
      <div class="mb-4">
        <label class="block text-gray-700 font-bold mb-2" for="find-name">
          이름
        </label>
        <input
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                id="find-name" type="text" placeholder="이름">
      </div>
      <div class="mb-4">
        <label class="block text-gray-700 font-bold mb-2" for="find-id">
          아이디
        </label>
        <input
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                id="find-id" type="text" placeholder="아이디">
      </div>
      <div class="mb-4">
        <label class="block text-gray-700 font-bold mb-2" for="find-email">
          이메일
        </label>
        <input
                class="shadow appearance-none border rounded w-full py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline"
                id="find-email" type="email" placeholder="이메일">
      </div>
      <button
              class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded focus:outline-none focus:shadow-outline w-full"
              id="submit-find-password">
        임시 비밀번호 이메일 받기
      </button>
    </div>

    <!-- 로그인 페이지로 돌아가는 버튼 -->
    <div class="mt-4">
      <a href="login.html" class="inline-block align-baseline font-bold text-sm text-blue-500 hover:text-blue-800 w-full text-center">
        로그인 페이지로 돌아가기
      </a>
    </div>
  </div>
</div>

<script>
  // 아이디 찾기 버튼 클릭 시
  document.getElementById('find-id-btn').addEventListener('click', () => {
    document.getElementById('find-id-form').style.display = 'block';
    document.getElementById('find-password-form').style.display = 'none';
  });

  // 비밀번호 찾기 버튼 클릭 시
  document.getElementById('find-password-btn').addEventListener('click', () => {
    document.getElementById('find-password-form').style.display = 'block';
    document.getElementById('find-id-form').style.display = 'none';
  });

  // 아이디 찾기 제출
  document.getElementById('submit-find-id').addEventListener('click', async () => {
    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;

    try {
      const response = await fetch('/api/members/find-id', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ name, email })
      });

      const data = await response.json();

      if (response.ok) {
        alert('아이디가 이메일로 전송되었습니다.');
      } else {
        alert(data.message || '아이디 찾기 실패');
      }
    } catch (error) {
      console.error('Error:', error);
      alert('아이디 찾기 중 에러가 발생했습니다.');
    }
  });

  // 비밀번호 찾기 제출
  document.getElementById('submit-find-password').addEventListener('click', async () => {
    const name = document.getElementById('find-name').value;
    const id = document.getElementById('find-id').value;
    const email = document.getElementById('find-email').value;

    try {
      const response = await fetch('/api/members/find-password', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ name, id, email })
      });

      const data = await response.json();

      if (response.ok) {
        alert('임시 비밀번호가 이메일로 전송되었습니다.');
      } else {
        alert(data.message || '비밀번호 찾기 실패');
      }
    } catch (error) {
      console.error('Error:', error);
      alert('비밀번호 찾기 중 에러가 발생했습니다.');
    }
  });
</script>
</body>
</html>
