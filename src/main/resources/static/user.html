<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>사용자 대시보드</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .welcome-message {
            font-size: 24px;
        }
        .button-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .logout-btn {
            background-color: #ff4444;
        }
        .content {
            background-color: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1 class="welcome-message">사용자 대시보드</h1>
        <div class="button-group">
            <button class="btn" onclick="window.location.href='/mypage.html'">마이페이지</button>
            <button class="logout-btn" id="logout-btn">로그아웃</button>
        </div>
    </div>
    <div class="content">
        <h2>내 정보</h2>
        <div id="user-info">
            <!-- 사용자 정보가 여기에 동적으로 표시됨 -->
        </div>
    </div>
</div>

<script>
    async function fetchWithAuth(url, options = {}) {
        const token = localStorage.getItem('token');
        if (!token) {
            throw new Error('No token found');
        }
        const headers = {
            ...options.headers,
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
        };
        try {
            const response = await fetch(url, { ...options, headers });
            if (response.status === 401) {
                localStorage.removeItem('token');
                window.location.href = '/index.html';
                return;
            }
            return response;
        } catch (error) {
            console.error('API request failed:', error);
            throw error;
        }
    }

    async function loadUserInfo() {
        try {
            const response = await fetchWithAuth('/api/members/me');
            if (response.ok) {
                const userData = await response.json();
                document.getElementById('user-info').innerHTML = `
                    <p>아이디: ${userData.id}</p>
                    <p>이름: ${userData.name}</p>
                    <p>이메일: ${userData.email}</p>
                    <p>전화번호: ${userData.phoneNumber}</p>
                `;
            }
        } catch (error) {
            console.error('Failed to load user info:', error);
        }
    }

    document.addEventListener('DOMContentLoaded', async () => {
        const token = localStorage.getItem('token');
        if (!token) {
            alert('로그인이 필요합니다.');
            window.location.href = '/index.html';
            return;
        }

        try {
            const payload = JSON.parse(atob(token.split('.')[1]));
            if (payload.role !== 'USER') {
                alert('접근 권한이 없습니다.');
                window.location.href = '/index.html';
                return;
            }

            await loadUserInfo();
        } catch (error) {
            console.error('Error:', error);
            alert('토큰이 유효하지 않습니다.');
            window.location.href = '/index.html';
        }
    });

    document.getElementById('logout-btn').addEventListener('click', () => {
        localStorage.removeItem('token');
        window.location.href = '/index.html';
    });
</script>
</body>
</html>
